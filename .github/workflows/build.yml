name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: 安装打包依赖
        run: |
          brew install dpkg ldid || brew install dpkg || true
          which dpkg-deb || echo "!! 缺少 dpkg-deb"
          which ldid || echo "!! 缺少 ldid（签名可能失败）"

      - name: 准备 Theos（roothide 分支）
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"

      - name: 构建三条产物线
        run: ./scripts/build_packages.sh all

      - name: 记录产物信息
        run: |
          for f in out/*.deb; do
            echo "== $f"
            dpkg-deb -f "$f" Package Version Architecture
            dpkg-deb -c "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: out/*.deb

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.deb --clobber
          else
            gh release create "$TAG" out/*.deb \
              --title "$TAG — 酷安 16.7.3 去广告" \
              --notes "适配酷安 16.7.3（build 2611121）。roothide 为实测产物，rootful / rootless 未在真机验证。"
          fi